<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">AI Gallery — AI 图片画廊：951 张原创 AI 图片</title>
  <desc id="desc">暗色底标题：AI Gallery，副标题 AI 图片画廊；右侧是 3×3 画廊网格缩影，中央一格高亮，画着珍珠耳环少女的剪影圆点。</desc>

  <rect width="1200" height="360" rx="26" fill="#111318"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#7dd3fc">AI 图片画廊 · AI IMAGE GALLERY</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f8fafc">AI Gallery</text>
    <text x="56" y="168" font-size="23" fill="#e2e8f0">951 张原创 AI 图片，网格、列表、灯箱随心看</text>
    <text x="56" y="204" font-size="19" fill="#94a3b8">搜索、排序、文件夹、本地点赞收藏，暗色主题。</text>
    <g id="chips" font-size="18" fill="#e2e8f0" text-anchor="middle">
      <g><rect x="56" y="238" width="120" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="116" y="262">951 张原图</text></g>
      <g><rect x="188" y="238" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="278" y="262">React + Zustand</text></g>
      <g><rect x="380" y="238" width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="475" y="262">网格 / 列表 / 灯箱</text></g>
      <g><rect x="582" y="238" width="108" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5"/><text x="636" y="262">暗色主题</text></g>
    </g>
  </g>

  <g id="grid-motif" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="820" y="40" font-size="18" fill="#7dd3fc">网格浏览 · GRID VIEW</text>
    <g id="cells">
      <rect x="820" y="56" width="84" height="84" rx="10" fill="#b45309"/>
      <rect x="916" y="56" width="84" height="84" rx="10" fill="#0e7490"/>
      <rect x="1012" y="56" width="84" height="84" rx="10" fill="#be185d"/>
      <rect x="820" y="152" width="84" height="84" rx="10" fill="#4d7c0f"/>
      <rect x="916" y="152" width="84" height="84" rx="10" fill="#1e3a5f"/>
      <rect x="1012" y="152" width="84" height="84" rx="10" fill="#6d28d9"/>
      <rect x="820" y="248" width="84" height="84" rx="10" fill="#9f1239"/>
      <rect x="916" y="248" width="84" height="84" rx="10" fill="#155e75"/>
      <rect x="1012" y="248" width="84" height="84" rx="10" fill="#a16207"/>
    </g>
    <g id="cell-details" fill="#ffffff" opacity="0.85">
      <circle cx="862" cy="98" r="16"/>
      <circle cx="1054" cy="98" r="12"/>
      <circle cx="862" cy="290" r="12"/>
      <circle cx="1054" cy="290" r="16"/>
    </g>
    <g id="pearl" transform="translate(958 194)">
      <circle r="24" fill="#f8fafc"/>
      <circle cx="-7" cy="-8" r="7" fill="#ffffff"/>
      <circle cx="10" cy="12" r="4" fill="#cbd5e1"/>
    </g>
    <rect x="916" y="152" width="84" height="84" rx="10" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <g id="lightbox-hint" transform="translate(1062 306)">
      <circle r="20" fill="#22d3ee"/>
      <circle r="9" fill="none" stroke="#111318" stroke-width="3"/>
      <line x1="7" y1="7" x2="14" y2="14" stroke="#111318" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
